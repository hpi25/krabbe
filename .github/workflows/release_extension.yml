name: Release Extension

on:
  push:
    branches:
      - main
    paths:
      - browser-extension/**
      - .github/workflows/release_extension.yml
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in quick succession must not race on the same tag and assets
concurrency:
  group: release-extension
  cancel-in-progress: false

env:
  TAG: browser-extension
  FIREFOX_ASSET: krabbe.xpi
  CHROME_ASSET: krabbe-chrome.zip

jobs:
  release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: browser-extension

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Corepack is no longer bundled with Node.js, and must be enabled before setup-node can cache yarn
      - run: npm install --global corepack && corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'yarn'
          cache-dependency-path: browser-extension/yarn.lock
      - run: yarn install --immutable
      # Builds every target into dist/<target>
      - run: yarn build
      # Both packages are zips with manifest.json at their root (an xpi is just a renamed zip)
      - run: cd dist/firefox && zip -r -X "../$FIREFOX_ASSET" .
      - run: cd dist/chrome && zip -r -X "../$CHROME_ASSET" .

      # Move the tag to this commit so the release always points at the build it carries
      - run: |
          git tag --force "$TAG"
          git push --force origin "refs/tags/$TAG"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Latest build of the browser extension from ${GITHUB_SHA::7}."
            echo
            cat <<'EOF'
          - **Firefox:** drag and drop `krabbe.xpi` into `about:addons`. The build is unsigned, so this needs Firefox Developer Edition, Nightly or ESR with `xpinstall.signatures.required` set to `false` in `about:config`.
          - **Chrome / Chromium / Edge:** unzip `krabbe-chrome.zip` into a folder, open `chrome://extensions`, enable **Developer mode**, click **Load unpacked** and select that folder.
          EOF
          } > "$notes"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Browser extension" --notes-file "$notes"
          else
            gh release create "$TAG" --title "Browser extension" --notes-file "$notes" --latest=false
          fi
          # Same file names every time, so --clobber replaces the old builds instead of adding new ones
          gh release upload "$TAG" "dist/$FIREFOX_ASSET" "dist/$CHROME_ASSET" --clobber
