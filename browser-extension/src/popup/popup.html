<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        width: 360px;
        height: 500px;
        margin: 0;
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
      }

      @keyframes load {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      #loader {
        position: absolute;
        top: 0;
        left: 0;
        width: 360px;
        height: 500px;
        background-color: #FFFFFF;
        z-index: -1;
      }
      #loader::after {
        content: '';
        position: absolute;
        top: calc(50% - 15px);
        left: calc(50% - 15px);
        height: 24px;
        width: 24px;
        border: 3px solid #F79E00;
        border-left-color: transparent;
        border-radius: 100px;
        animation: load .5s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        #loader {
          background-color: #111111;
        }
      }

      iframe {
        flex: 1;
        width: 100%;
        border: 0;
      }

      header {
        display: flex;
        justify-content: flex-end;
        padding: 6px 8px;
        border-bottom: 1px solid #DDDDDD;
        background-color: #FFFFFF;
      }
      header button {
        font: inherit;
        font-size: 13px;
        padding: 4px 10px;
        border: 1px solid #F79E00;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      header button:hover {
        background-color: #F79E0022;
      }
      @media (prefers-color-scheme: dark) {
        header {
          border-bottom-color: #333333;
          background-color: #111111;
          color: #EEEEEE;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader"></div>
    <header>
      <button id="open-settings" type="button">Calendar settings</button>
    </header>
    <iframe id="frame" allow="clipboard-write"></iframe>
    <script type="module" src="popup.js"></script>
  </body>
</html>
