# Deploys the frontend, API and a Postgres database
# Works with both `docker compose` and `podman compose`
#
# Required variables (set in a .env file next to this one):
#   POSTGRES_PASSWORD    password for the database
#   FRONTEND_URL         public URL of the frontend, e.g. https://krabbe.domain
#
# The API is served under /api, so route https://krabbe.domain/api/* to the api service
# and everything else to the frontend service in your reverse proxy (without stripping the prefix)
#
# Pull the published images with `docker compose pull`, or build locally with `docker compose build`

services:
  frontend:
    image: ghcr.io/hpi25/krabbe-frontend:${IMAGE_TAG:-latest}
    build:
      context: frontend
      dockerfile: Containerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_API_KEY: ${NEXT_PUBLIC_GOOGLE_API_KEY:-}
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT:-8080}:3000
    environment:
      # Server-side requests go straight to the api service
      API_URL: http://api:3000/api
    depends_on:
      - api

  api:
    image: ghcr.io/hpi25/krabbe-api:${IMAGE_TAG:-latest}
    build:
      context: api
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - ${API_PORT:-3000}:3000
    environment:
      BASE_PATH: /api
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      DATABASE_URL: postgresql://krabbe:${POSTGRES_PASSWORD}@db:5432/krabbe
      CRON_KEY: ${CRON_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: krabbe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: krabbe
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "krabbe", "-d", "krabbe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
