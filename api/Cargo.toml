[package]
name = "crabfit-api"
description = "API for Crab Fit"
license = "GPL-3.0-only"
version = "3.0.0"
edition.workspace = true

[features]
sql-adaptor = []

[workspace]
members = ["common", "adaptors/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
chrono = "0.4.45"
common = { path = "common" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = "1.54.0"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
common.workspace = true
sql-adaptor = { path = "adaptors/sql" }
memory-adaptor = { path = "adaptors/memory" }
dotenvy = "0.15.7"
serde_json.workspace = true
rand = "0.10.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
chrono.workspace = true
bcrypt = "0.19.3"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tower_governor = "0.8.0"
utoipa = { version = "6.0.0", features = ["axum_extras", "preserve_order"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }
base64 = "0.23.1"
